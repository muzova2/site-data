# Каждый вечер забирает свежие данные страниц bulkacapital.ru из веб-приложения Google
# и сохраняет их файлами data/<ключ>.json; GitHub Pages сразу отдаёт их сайту.
name: Обновить данные
on:
  schedule:
    # 14.11.2026: четыре запуска за вечер (GitHub запускает по расписанию с опозданием до 5 часов).
    # Раньше 22:30 МСК нельзя: Google пересчитывает данные до 22:20. Если данные не изменились, запуск ничего не записывает.
    - cron: '37 19 * * *'   # 22:37 МСК
    - cron: '37 20 * * *'   # 23:37 МСК
    - cron: '37 21 * * *'   # 00:37 МСК
    - cron: '37 22 * * *'   # 01:37 МСК
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Забрать данные из веб-приложения Google
        run: |
          EXEC='https://script.google.com/macros/s/AKfycbyQammVyKFaW1iym9aCJV7lxRWvePm8T4xx5wkstlF56SHBSVNlfsji4BX7AXXq_YAG/exec'
          mkdir -p data
          for k in dividends bonds shares funds indices curve coupons fx futures options dohod; do
            if [ "$k" = dividends ]; then q=''; else q="?d=$k"; fi
            for i in 1 2 3; do
              if curl -sSL --max-time 120 "$EXEC$q" -o "/tmp/$k.json" && python3 -c "import json,sys; d=json.load(open('/tmp/$k.json')); sys.exit(0 if isinstance(d,dict) and d else 1)"; then
                mv "/tmp/$k.json" "data/$k.json"; echo "$k: ок"; break
              fi
              echo "$k: попытка $i не удалась"; sleep 20
            done
          done
      - name: Инфляция без сезонности (SAAR) и базовая инфляция из файла Банка России
        continue-on-error: true
        run: |
          pip install -q openpyxl
          curl -sSL --max-time 120 -A 'Mozilla/5.0' 'https://www.cbr.ru/Content/Document/File/108632/indicators_cpd.xlsx' -o /tmp/cpd.xlsx
          python3 - <<'PY'
          import openpyxl, json, datetime
          ws = openpyxl.load_workbook('/tmp/cpd.xlsx', read_only=True, data_only=True).worksheets[0]
          rows = list(ws.iter_rows(values_only=True)); hdr = rows[0]
          last = max(i for i, v in enumerate(hdr) if isinstance(v, datetime.datetime))
          def row(name): return next(r for r in rows if r[0] and str(r[0]).strip() == name)
          a = lambda m: round(((1 + m / 100) ** 12 - 1) * 100, 2)
          al, co = row('Все товары и услуги'), row('Базовый ИПЦ')
          assert isinstance(al[last], (int, float)) and isinstance(co[last], (int, float))
          d = {'updated': datetime.date.today().isoformat(), 'src': 'Банк России, indicators_cpd.xlsx',
               'month': hdr[last].strftime('%Y-%m'),
               'saar': a(al[last]), 'saar_prev': a(al[last - 1]), 'saar3': a(sum(al[last - 2:last + 1]) / 3),
               'core_saar': a(co[last]), 'core_saar_prev': a(co[last - 1]), 'core_saar3': a(sum(co[last - 2:last + 1]) / 3),
               'hist': [[hdr[i].strftime('%Y-%m'), a(al[i]), a(co[i])] for i in range(max(1, last - 35), last + 1)]}
          json.dump(d, open('data/cpi.json', 'w'), ensure_ascii=False)
          print('cpi:', d['month'], d['saar'], d['core_saar'])
          PY
      - name: Годовая инфляция (ИПЦ, г/г) из таблицы Банка России «Инфляция и ключевая ставка»
        continue-on-error: true
        run: |
          python3 - <<'PY'
          # 14.11.2026: дописывает в data/cpi.json поля yoy (ИПЦ к тому же месяцу прошлого года), yoy_month, yoy_prev, yoy_hist.
          import json, os, re, datetime, urllib.request
          t = datetime.date.today()
          url = ('https://www.cbr.ru/hd_base/infl/?UniDbQuery.Posted=True&UniDbQuery.From=01.01.%d&UniDbQuery.To=%s'
                 % (t.year - 2, t.strftime('%d.%m.%Y')))
          page = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'}), timeout=60).read().decode('utf-8', 'replace')
          rows = re.findall(r'<td[^>]*>\s*(\d\d)\.(\d{4})\s*</td>\s*<td[^>]*>\s*[\d,]+\s*</td>\s*<td[^>]*>\s*(-?[\d,]+)\s*</td>', page)
          yoy = sorted((y + '-' + m, float(v.replace(',', '.'))) for m, y, v in rows)
          assert len(yoy) >= 2, 'таблица ЦБ не разобрана'
          p = 'data/cpi.json'
          d = json.load(open(p)) if os.path.exists(p) else {}
          d.update({'yoy_month': yoy[-1][0], 'yoy': yoy[-1][1], 'yoy_prev': yoy[-2][1], 'yoy_hist': yoy[-24:],
                    'yoy_src': 'Банк России, «Инфляция и ключевая ставка»'})
          json.dump(d, open(p, 'w'), ensure_ascii=False)
          print('yoy:', d['yoy_month'], d['yoy'], 'месяцем раньше', d['yoy_prev'])
          PY
      - name: Ожидания населения, трендовая инфляция и денежная масса M2 (Банк России)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          # 14.11.2026: пишет data/macro.json. Каждая часть независима: если одна не скачалась, остальные и прошлые значения остаются.
          import json, os, re, io, zipfile, datetime, urllib.request, openpyxl
          UA = {'User-Agent': 'Mozilla/5.0'}
          CBR = 'https://www.cbr.ru'
          get = lambda u: urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=120).read()
          p = 'data/macro.json'
          d = json.load(open(p)) if os.path.exists(p) else {}
          ym = lambda dt: dt.strftime('%Y-%m')
          # 1) инфляционные ожидания населения (опрос «инФОМ»): последний файл со страницы ЦБ, ряды берём из графиков файла
          try:
              page = get(CBR + '/statistics/ddkp/inflationary_expectations/').decode('utf-8', 'replace')
              href = re.findall(r'href="([^"]*Infl_exp_\d\d-\d\d\.xlsx)"', page)[0]
              z = zipfile.ZipFile(io.BytesIO(get(CBR + href)))
              ser = {}
              for n in z.namelist():
                  if not re.match(r'xl/charts/chart\d+\.xml$', n): continue
                  for s in re.findall(r'<c:ser>(.*?)</c:ser>', z.read(n).decode('utf-8', 'replace'), re.S):
                      nm = (re.findall(r'<c:tx>.*?<c:v>(.*?)</c:v>', s, re.S) or [''])[0].strip()
                      cat = re.findall(r'<c:v>(.*?)</c:v>', (re.findall(r'<c:cat>(.*?)</c:cat>', s, re.S) or [''])[0])
                      val = re.findall(r'<c:v>(.*?)</c:v>', (re.findall(r'<c:val>(.*?)</c:val>', s, re.S) or [''])[0])
                      try:   # подписи-даты как числа Excel; ряды с текстовыми подписями пропускаем, из одноимённых берём самый длинный
                          pts = [(ym(datetime.date(1899, 12, 30) + datetime.timedelta(days=int(float(c)))), round(float(v), 1)) for c, v in zip(cat, val)]
                      except ValueError:
                          continue
                      if nm and len(cat) == len(val) and len(pts) > len(ser.get(nm, [])):
                          ser[nm] = pts
              obs, exp = ser['годовая наблюдаемая инфляция'], ser['годовая инфляция, ожидаемая через год']
              ob = dict(obs)
              d['exp'] = {'month': exp[-1][0], 'expected': exp[-1][1], 'expected_prev': exp[-2][1],
                          'observed': ob.get(exp[-1][0]), 'observed_prev': ob.get(exp[-2][0]),
                          'hist': [[m, v, ob.get(m)] for m, v in exp], 'src': 'Банк России, опрос «инФОМ»'}
              print('exp:', d['exp']['month'], d['exp']['expected'], d['exp']['observed'])
          except Exception as e:
              print('ожидания: ошибка', repr(e), [k for k in locals().get('ser', {}) if 'инфляц' in k][:15])
          # 2) трендовая инфляция (оценка устойчивой инфляции Банка России), % годовых
          try:
              R = list(openpyxl.load_workbook(io.BytesIO(get(CBR + '/Content/Document/File/108633/est_infl.xlsx')), read_only=True, data_only=True).worksheets[0].iter_rows(values_only=True))
              hdr = next(r for r in R if sum(isinstance(x, datetime.datetime) for x in r) > 12)
              row = next(r for r in R if r[0] and str(r[0]).startswith('Оценка трендовой инфляции (5'))
              pts = [(ym(h), round(float(v), 2)) for h, v in zip(hdr, row) if isinstance(h, datetime.datetime) and isinstance(v, (int, float))]
              d['trend'] = {'month': pts[-1][0], 'value': pts[-1][1], 'prev': pts[-2][1], 'hist': pts[-36:], 'src': 'Банк России, оценка трендовой инфляции'}
              print('trend:', d['trend']['month'], d['trend']['value'])
          except Exception as e:
              print('трендовая: ошибка', e)
          # 3) денежная масса M2 (млрд ₽, на 1-е число месяца) и её рост за год с 2014 года
          try:
              y = datetime.date.today().year
              raw = json.loads(get(CBR + '/dataservice/data?y1=2013&y2=%d&publicationId=5&datasetId=7' % y))['RawData']
              v = {x['date'][:7]: x['obs_val'] for x in raw if x['element_id'] == 12 and x['obs_val'] is not None}
              ks = sorted(v)
              def back(k): yy, mm = int(k[:4]), int(k[5:]); return '%d-%02d' % (yy - 1, mm)
              hist = [[k, round((v[k] / v[back(k)] - 1) * 100, 1)] for k in ks if back(k) in v]
              d['m2'] = {'month': ks[-1], 'value': round(v[ks[-1]], 1), 'yoy': hist[-1][1], 'yoy_prev': hist[-2][1], 'hist': hist,
                         'src': 'Банк России, денежная масса (национальное определение)'}
              print('m2:', d['m2']['month'], d['m2']['value'], d['m2']['yoy'])
          except Exception as e:
              print('M2: ошибка', e)
          if d:
              d['updated'] = datetime.date.today().isoformat()
              json.dump(d, open(p, 'w'), ensure_ascii=False)
          PY
      - name: Доски опционов (запасной снимок для страницы «Опционы»)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          # Для каждого базового актива из data/options.json — доска на 4 ближайшие даты исполнения.
          # Хранятся только поля, которые использует страница. Файлы: data/optboard/<актив>.json
          import json, os, datetime, urllib.request, urllib.parse, time
          from concurrent.futures import ThreadPoolExecutor
          ISS = 'https://iss.moex.com/iss/statistics/engines/futures/markets/options/assets/'
          KEEP = {'asset': ['UNDERLYINGASSET', 'UNDERLYINGSETTLEPRICE'],
                  'call': ['SECID', 'STRIKE', 'THEORPRICE', 'VOLAT', 'OPENPOSITION'],
                  'put':  ['SECID', 'STRIKE', 'THEORPRICE', 'VOLAT', 'OPENPOSITION']}
          msk = datetime.datetime.utcnow() + datetime.timedelta(hours=3)
          today = msk.date().isoformat()
          ref = json.load(open('data/options.json', encoding='utf8'))
          dates = {}
          for a in ref['assets']:
              dates.setdefault(a['a'], set()).update(d for d in a['exps'] if d >= today)
          jobs = [(a, d) for a, ds in dates.items() for d in sorted(ds)[:4]]
          def get(job):
              a, d = job
              url = ISS + urllib.parse.quote(a) + '/optionboard.json?iss.meta=off&expiration_date=' + d
              for i in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'}), timeout=30) as r:
                          j = json.load(r)
                      out = {}
                      for blk, cols in KEEP.items():
                          b = j.get(blk) or {'columns': [], 'data': []}
                          idx = [b['columns'].index(c) for c in cols if c in b['columns']]
                          out[blk] = {'columns': [b['columns'][k] for k in idx], 'data': [[row[k] for k in idx] for row in b['data']]}
                      # множитель контракта (руб. за пункт) — по одному опциону этой даты, как считает калькулятор: STEPPRICE / MINSTEP
                      sec = next((r[0] for blk in ('call', 'put') for r in out[blk]['data'] if r), None)
                      if sec:
                          try:
                              u2 = 'https://iss.moex.com/iss/engines/futures/markets/options/securities/' + urllib.parse.quote(sec) + '.json?iss.meta=off&iss.only=securities'
                              with urllib.request.urlopen(urllib.request.Request(u2, headers={'User-Agent': 'Mozilla/5.0'}), timeout=30) as r2:
                                  sj = json.load(r2)['securities']
                              row = dict(zip(sj['columns'], sj['data'][0]))
                              if row.get('MINSTEP') and row.get('STEPPRICE'):
                                  out['mult'] = row['STEPPRICE'] / row['MINSTEP']
                          except Exception as e2:
                              print('нет условий контракта', a, d, sec, e2)
                      return a, d, out
                  except Exception as e:
                      err = e; time.sleep(3)
              print('нет доски', a, d, err); return a, d, None
          with ThreadPoolExecutor(4) as ex:
              res = list(ex.map(get, jobs))
          os.makedirs('data/optboard', exist_ok=True)
          by = {}
          for a, d, b in res:
              if b and (b['call']['data'] or b['put']['data']):
                  by.setdefault(a, {})[d] = b
          stamp = msk.strftime('%Y-%m-%d %H:%M')
          for a, boards in by.items():
              json.dump({'updated': stamp, 'asset': a, 'boards': boards}, open('data/optboard/' + a + '.json', 'w', encoding='utf8'), ensure_ascii=False, separators=(',', ':'))
          print('доски опционов:', len(by), 'активов,', sum(len(v) for v in by.values()), 'досок из', len(jobs), '; с множителем:', sum(1 for v in by.values() for b in v.values() if 'mult' in b))
          assert by, 'биржа не отдала ни одной доски'
          PY
      - name: Сохранить
        run: |
          git config user.name 'site-data bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data
          git diff --cached --quiet || git commit -m "Данные $(date -u +%F)"
          git push
