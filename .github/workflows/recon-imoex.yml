name: recon-imoex (временно, удалить)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: История индекса ММВБ/Мосбиржи 1997-2026
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, urllib.request
          def get(url):
              with urllib.request.urlopen(url, timeout=60) as r:
                  return json.load(r)
          rows = []
          start = 0
          base = ("https://iss.moex.com/iss/history/engines/stock/markets/index/securities/IMOEX.json"
                  "?from=1997-09-01&till=2026-12-31&iss.meta=off&history.columns=TRADEDATE,CLOSE,LOW,HIGH&start=")
          while True:
              d = get(base + str(start))["history"]["data"]
              if not d:
                  break
              rows += d
              start += len(d)
          rows = [r for r in rows if r[1]]
          print("## IMOEX: дней", len(rows), "с", rows[0][0], "по", rows[-1][0])
          def mx(a, b):
              s = [r for r in rows if a <= r[0] <= b]
              return max(s, key=lambda r: r[1]), min(s, key=lambda r: r[1])
          for a, b in [("2007-01-01", "2007-12-31"), ("2008-01-01", "2008-12-31"), ("2008-05-01", "2008-05-31"),
                       ("2008-09-01", "2009-03-31"), ("2009-01-01", "2009-12-31"), ("2021-01-01", "2021-12-31"),
                       ("2022-01-01", "2022-12-31"), ("2026-01-01", "2026-12-31")]:
              hi, lo = mx(a, b)
              print("-", a, b, "max", hi[0], hi[1], "min", lo[0], lo[1])
          for day in ["2007-12-28", "2008-05-19", "2008-09-12", "2008-09-15", "2008-10-24", "2008-12-30",
                      "2009-12-30", "2010-12-30", "2011-12-30", "2015-12-30", "2016-12-30", "2022-02-22",
                      "2022-02-24", "2022-03-24", "2022-12-30", "2024-05-17"]:
              s = [r for r in rows if r[0] <= day]
              print("- close на", day, ":", s[-1][0], s[-1][1])
          peak = max(r[1] for r in rows if r[0] < "2008-12-31")
          first = next((r for r in rows if r[0] > "2009-01-01" and r[1] >= peak), None)
          print("- пик до 2009:", peak, "первое закрытие выше:", first)
          peak21 = max(r[1] for r in rows if "2021-01-01" <= r[0] <= "2021-12-31")
          first21 = next((r for r in rows if r[0] > "2022-01-01" and r[1] >= peak21), None)
          print("- пик 2021:", peak21, "первое закрытие выше:", first21)
          print()
          print("### Конец месяца")
          last = {}
          for r in rows:
              last[r[0][:7]] = r
          for k in sorted(last):
              print("-", k, last[k][1])
          PY
