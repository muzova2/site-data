name: Разведка источников
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка доступа
        run: |
          {
          echo '```'
          echo "IP: $(curl -s -m 10 https://ipinfo.io/ip) страна: $(curl -s -m 10 https://ipinfo.io/country)"
          for u in https://invest-public-api.tbank.ru/rest/tinkoff.public.invest.api.contract.v1.InstrumentsService/Shares \
                   https://invest-public-api.tinkoff.ru/rest/tinkoff.public.invest.api.contract.v1.InstrumentsService/Shares \
                   https://sandbox-invest-public-api.tbank.ru/rest/tinkoff.public.invest.api.contract.v1.InstrumentsService/Shares; do
            r=$(curl -s -m 30 -o /tmp/b -w "%{http_code} за %{time_total} c" -X POST -H 'Content-Type: application/json' -d '{"instrumentStatus":"INSTRUMENT_STATUS_BASE"}' "$u" 2>&1)
            echo "$u -> $r | $(head -c 160 /tmp/b 2>/dev/null)"
          done
          echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
