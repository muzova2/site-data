# ВРЕМЕННО (14.11.2026): разведка источников данных ЦБ и Росстата. Ничего не записывает. Удалить после проверки.
name: Разведка источников
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q openpyxl
      - name: Разведка
        run: |
          python3 - <<'PY'
          import re, urllib.request, json, io, openpyxl, datetime
          UA = {'User-Agent': 'Mozilla/5.0'}
          def get(u, n=60):
              try:
                  return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=n).read()
              except Exception as e:
                  print('  ОШИБКА', u, e); return b''
          def links(u, pat=r'\.(xlsx|xls|csv|json)'):
              t = get(u).decode('utf-8', 'replace')
              print('\n=== ', u, len(t))
              for h, txt in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', t, re.S):
                  if re.search(pat, h, re.I):
                      print('  ', h, '|', re.sub(r'\s+', ' ', re.sub('<[^>]+>', '', txt)).strip()[:90])
          for u in ['https://www.cbr.ru/analytics/dkp/inflationary_expectations/',
                    'https://www.cbr.ru/analytics/dkp/monitoring/',
                    'https://www.cbr.ru/statistics/macro_itm/dkfs/',
                    'https://www.cbr.ru/statistics/ms/',
                    'https://www.cbr.ru/statistics/macro_itm/',
                    'https://www.cbr.ru/analytics/dkp/inflation/',
                    'https://rosstat.gov.ru/statistics/price']:
              links(u)
          print('\n=== dataservice publications')
          try:
              for p in json.loads(get('https://www.cbr.ru/dataservice/publications')):
                  print('  ', p.get('id'), p.get('parent_id'), p.get('category_name'))
          except Exception as e:
              print('  ', e)
          print('\n=== indicators_cpd.xlsx: строки')
          b = get('https://www.cbr.ru/Content/Document/File/108632/indicators_cpd.xlsx', 120)
          if b:
              for ws in openpyxl.load_workbook(io.BytesIO(b), read_only=True, data_only=True).worksheets:
                  rows = list(ws.iter_rows(values_only=True)); print(' лист', ws.title, len(rows))
                  for r in rows[:60]:
                      vals = [v for v in r if v is not None]
                      print('   ', str(r[0])[:70] if r[0] else '-', '|', vals[-3:] if len(vals) > 1 else '')
          PY
