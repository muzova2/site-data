# ВРЕМЕННО (14.11.2026): разведка источников данных ЦБ и Росстата. Ничего не записывает в репозиторий. Удалить после проверки.
name: Разведка источников
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q openpyxl
      - name: Разведка
        run: |
          python3 - <<'PY' > /tmp/out.txt 2>&1 || true
          import re, urllib.request, json, io, openpyxl, ssl, html
          UA = {'User-Agent': 'Mozilla/5.0'}
          NOSSL = ssl.create_default_context(); NOSSL.check_hostname = False; NOSSL.verify_mode = ssl.CERT_NONE
          def get(u, n=60, ctx=None):
              try:
                  return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=n, context=ctx).read()
              except Exception as e:
                  print('ERR', u, str(e)[:80]); return b''
          txt = lambda b: html.unescape(re.sub(r'<[^>]+>', ' ', b.decode('utf-8', 'replace')))
          for u in ['https://rosstat.gov.ru/folder/313', 'https://rosstat.gov.ru/news', 'https://rosstat.gov.ru/folder/313/document']:
              b = get(u, ctx=NOSSL); t = txt(b); print('\n##', u, len(t))
              for m in re.finditer(r'(индекс потребительских цен|ИПЦ|инфляци)[^.]{0,160}', t, re.I):
                  print('  ', re.sub(r'\s+', ' ', m.group(0))[:170])
                  if m.start() > 0 and len(re.findall('', '')) > 30: break
              hrefs = re.findall(r'href="([^"]*(?:document|news)/\d+[^"]*)"[^>]*>([^<]{0,140})', b.decode('utf-8', 'replace'))
              for h, a in hrefs[:15]: print('   link', h, '|', a.strip()[:100])
          print('\n## est_infl names')
          b = get('https://www.cbr.ru/Content/Document/File/108633/est_infl.xlsx', 120)
          if b:
              for r in list(openpyxl.load_workbook(io.BytesIO(b), read_only=True, data_only=True).worksheets[0].iter_rows(values_only=True))[:8]:
                  if r[0]: print('  ', str(r[0])[:200])
          PY
          { echo '```'; head -c 60000 /tmp/out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
